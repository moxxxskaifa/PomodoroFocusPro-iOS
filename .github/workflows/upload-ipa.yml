name: Build IPA & Upload to App Store
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode_26.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || echo "Xcode 26 not found, using default"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      - name: Install Gradle 8
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Build iOS Framework
        run: gradle :composeApp:linkReleaseFrameworkIosArm64

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcodeproj -N

      - name: Generate & Configure Xcode Project
        run: |
          xcodegen generate
          ruby -e "
          require 'xcodeproj'
          p = Xcodeproj::Project.open('Focus Timer Pro.xcodeproj')
          p.targets.each do |t|
            t.build_configurations.each do |c|
              c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              c.build_settings['DEVELOPMENT_TEAM'] = 'S45CCRJ5NS'
              c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'AllApps_AppStore_Distribution'
            end
          end
          p.save
          puts 'Project configured!'
          "

      - name: Import Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          openssl pkcs12 -in $RUNNER_TEMP/cert.p12 -nokeys -clcerts -passin pass:"$P12_PASSWORD" 2>/dev/null | openssl x509 -noout -subject -serial -dates
          openssl pkcs12 -in $RUNNER_TEMP/cert.p12 -clcerts -nokeys -passin pass:"$P12_PASSWORD" -out $RUNNER_TEMP/cert.cer
          openssl pkcs12 -in $RUNNER_TEMP/cert.p12 -nocerts -nodes -passin pass:"$P12_PASSWORD" -out $RUNNER_TEMP/key.pem
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/ci.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/ci.keychain-db
          security import $RUNNER_TEMP/cert.cer -k $RUNNER_TEMP/ci.keychain-db -A -T /usr/bin/codesign
          security import $RUNNER_TEMP/key.pem -k $RUNNER_TEMP/ci.keychain-db -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/ci.keychain-db 2>/dev/null || true
          security list-keychain -d user -s $RUNNER_TEMP/ci.keychain-db

      - name: Install Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/16827c3b-7a45-432f-87cd-84b9f335cdca.mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project "Focus Timer Pro.xcodeproj" \
            -scheme iosApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportPath $RUNNER_TEMP/IPA \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ipa=$(ls $RUNNER_TEMP/IPA/*.ipa 2>/dev/null | head -1)
          if [ -n "$ipa" ]; then
            xcrun altool --upload-app -f "$ipa" -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" --type ios
          else
            echo "No IPA found"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PomodoroFocusPro-IPA
          path: ${{ runner.temp }}/**/*.ipa
